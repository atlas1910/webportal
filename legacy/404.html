<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS1910 - Acervo Cartográfico do Corinthians</title>
  <style>
    body {
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin: 0 0 8px;
    }
    p {
      font-size: 13px;
      color: #a1a1aa;
      margin: 0;
    }
  </style>
  <script>
    (function() {
      try {
        var path = window.location.pathname;
        var matchCamada = /^\/camadas\/([^/]+)\/?$/.exec(path);
        var matchBrabas = /^\/as-brabas\/camadas\/([^/]+)\/?$/.exec(path);

        if (matchCamada) {
          var shareId = decodeURIComponent(matchCamada[1]);
          window.location.replace('/?camada=' + encodeURIComponent(shareId) + window.location.hash);
          return;
        }

        if (matchBrabas) {
          var shareIdBrabas = decodeURIComponent(matchBrabas[1]);
          window.location.replace('/as-brabas/?camada=' + encodeURIComponent(shareIdBrabas) + window.location.hash);
          return;
        }

        // Se for outro caminho não mapeado, redireciona para a raiz
        setTimeout(function() {
          window.location.replace('/');
        }, 1200);
      } catch (e) {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <h1>CARREGANDO CAMADA DO ACERVO</h1>
  <p>Conectando ao ATLAS1910...</p>
</body>
</html>
