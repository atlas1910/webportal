name: Atualizar acervo Meu Timão

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizacao-meutimao
  cancel-in-progress: false

jobs:
  update-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do sincronizador
        run: python -m pip install requests beautifulsoup4 geopandas pyogrio

      - name: Atualizar jogos, estádios e coordenadas
        run: python scripts/sync_meutimao.py

      - name: Publicar dados atualizados no repositório
        run: |
          git add data/partidas/corinthians_masculino.geojson \
            data/partidas/corinthians_feminino_meutimao.geojson \
            data/as_brabas/as_brabas_jogos.geojson \
            data/as_brabas/as_brabas_estadios_unificadas.geojson \
            data/as_brabas/brabas_bootstrap.json \
            data/estadios/ESTADIOS_MUNDO.gpkg \
            data/estadios/estadios_estatisticas_unificadas.geojson \
            data/estadio_geocoding_cache.json \
            data/meutimao_venue_details.json \
            data/meutimao_sync.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualiza acervo de jogos e estádios"
            git push
          fi