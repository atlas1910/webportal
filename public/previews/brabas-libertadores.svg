<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Libertadores Feminina 2026</title><desc id="desc">Prévia em preto e branco das localizações de equipes da camada Libertadores 2026.</desc><defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width=".7"/></pattern><radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><style>.route{fill:none;stroke:#f4f4f5;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 9;animation:flow 22s linear infinite}.route:nth-of-type(3n){stroke-opacity:.55;animation-duration:31s}.point{fill:#fff;stroke:#fff;stroke-width:1;animation:pulse 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.point:nth-of-type(3n){animation-delay:1.1s}@keyframes flow{to{stroke-dashoffset:-340}}@keyframes pulse{0%,100%{opacity:.52;transform:scale(.8)}50%{opacity:1;transform:scale(1.4)}}@media(prefers-reduced-motion:reduce){.route,.point{animation:none!important}}</style></defs><rect width="800" height="420" fill="#090a0e"/><rect width="800" height="420" fill="url(#grid)"/><ellipse cx="416" cy="201.6" rx="384" ry="260.4" fill="url(#glow)"/><path d="M0 323.40000000000003H800M160 0V420M640 0V420" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width=".8"/><circle class="point" cx="502.0" cy="288.4" r="2.5"/><circle class="point" cx="335.1" cy="357.3" r="1.4"/><circle class="point" cx="360.8" cy="53.1" r="1.4"/><circle class="point" cx="311.1" cy="93.5" r="1.4"/><circle class="point" cx="280.7" cy="128.1" r="1.4"/><circle class="point" cx="379.4" cy="342.8" r="1.4"/><circle class="point" cx="291.4" cy="209.0" r="1.4"/><circle class="point" cx="500.5" cy="288.3" r="2.5"/><circle class="point" cx="519.3" cy="263.0" r="1.4"/><circle class="point" cx="280.8" cy="126