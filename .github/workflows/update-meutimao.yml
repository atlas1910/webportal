name: Atualizar acervo Meu Timão

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizacao-meutimao
  cancel-in-progress: false

jobs:
  update-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do sincronizador
        run: python -m pip install requests beautifulsoup4 geopandas pyogrio

      - name: Atualizar jogos, estádios e coordenadas
        run: python legacy/scripts/sync_meutimao.py

      - name: Publicar os dados atualizados no WebGIS
        run: node scripts/sync-public-data.mjs

      - name: Salvar dados gerados e arquivos públicos
        run: |
          git add legacy/data public/data/partidas/corinthians_masculino.geojson \
            public/data/estadios/estadios_estatisticas_unificadas.geojson \
            public/data/as_brabas/as_brabas_jogos.geojson \
            public/data/as_brabas/as_brabas_estadios_unificadas.geojson \
            public/data/as_brabas/brabas_bootstrap.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Atualiza acervo de jogos e estádios"
            git push
          fi
